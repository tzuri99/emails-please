name: CI

# Runs on every push and PR. Nothing here touches Azure -- deployment is a
# separate workflow so a failing test can never ship.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Look for the dataset
        id: dataset
        # data/ is the organisers' to distribute, so it is not in the repo.
        # Rather than fail every run, the job reports what it could and
        # could not verify. See README, "Getting the dataset".
        run: |
          if [ -d data/inbox ] && [ -n "$(ls -A data/inbox 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dataset found; running the full suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data/ is not in the repository, so the 79 pipeline tests and the smoke run are skipped. The other 67 still run. See README 'Getting the dataset'."
          fi

      - name: Run tests (full suite)
        if: steps.dataset.outputs.present == 'true'
        working-directory: backend
        run: python -m pytest tests -q

      - name: Run tests (dataset-independent only)
        if: steps.dataset.outputs.present == 'false'
        working-directory: backend
        # test_pipeline.py reads the sample attachments, including the
        # scanned PDFs it OCRs. Everything else -- the review model, run
        # lifecycle, carry-forward, demo reset, auth -- does not.
        run: python -m pytest tests -q --ignore=tests/test_pipeline.py

      - name: Pipeline smoke run
        if: steps.dataset.outputs.present == 'true'
        working-directory: backend
        # Guards the end-to-end path: a submission for every email, and the
        # escalation reasons still landing where they should.
        run: |
          python -m app.pipeline.run ../data -o submission.json
          python - <<'PY'
          import collections, json
          sub = json.load(open("submission.json"))
          assert len(sub) == 520, f"expected 520 emails, got {len(sub)}"
          doc = {k: v for k, v in sub.items() if v["category"] == "BL_COMPARISON"}
          reasons = collections.Counter(
              v["review_reason"] for v in doc.values() if v["review_reason"])
          print("statuses:", collections.Counter(v["status"] for v in doc.values()))
          print("reasons:", dict(reasons))
          for reason in ("wrong_doc_type", "missing_attachment",
                         "unreadable", "missing_value"):
              assert reasons[reason] == 5, f"{reason}: expected 5, got {reason!r}"
          print("escalation reasons all correct")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    # Proves both Dockerfiles still build; does not push anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Stand in for the dataset
        # backend/Dockerfile does `COPY data /data`, and the real dataset is
        # not in the repo. This job only proves the Dockerfile still builds
        # and the dependencies still install -- the image is never pushed --
        # so an empty directory is enough to get past the COPY.
        run: mkdir -p data/inbox data/attachments

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          # Root context, NOT ./backend: every path in backend/Dockerfile is
          # relative to the project root (`COPY backend/app`, `COPY data`),
          # because Container Apps cannot bind-mount the dataset and the
          # image has to carry it.
          context: .
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
