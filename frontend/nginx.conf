server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness for this container. Declared before the SPA fallback,
    # which would otherwise swallow it and return index.html: a 200, but
    # HTML, which tells a probe nothing about whether the app is serving.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # Single-page app: unknown paths resolve to the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API so the browser needs no CORS grant and the frontend
    # needs no build-time knowledge of the backend host. BACKEND_URL is
    # substituted at container start.
    location /api/ {
        # proxy_pass through a VARIABLE, deliberately.
        #
        # With a literal hostname nginx resolves it while parsing the
        # config, and a failure is fatal -- so if the API is not up yet,
        # or its name does not resolve, the web container crash-loops
        # instead of serving the UI and returning 502 on /api. With a
        # variable, resolution is deferred to each request, which needs
        # the resolver below.
        resolver           ${NGINX_LOCAL_RESOLVERS} valid=30s;
        set $api_upstream  ${BACKEND_URL};
        proxy_pass         $api_upstream;

        # Host must be the UPSTREAM's name, not the browser's.
        #
        # Azure Container Apps' ingress routes by Host header, so
        # forwarding the browser's host (sdoc-web...) makes the internal
        # ingress unable to find sdoc-api and it answers 502 without the
        # request ever reaching uvicorn. $proxy_host is the host from
        # proxy_pass, resolved after the variable above.
        proxy_set_header   Host $proxy_host;

        # nginx proxies with HTTP/1.0 by default. Container Apps' ingress
        # refuses that and answers 426 Upgrade Required -- relayed back as a
        # 426 with an nginx Server header, so it reads like our bug when it
        # is the upstream's. The empty Connection header stops the hop-by-hop
        # "close" from being forwarded, which 1.1 keepalive needs.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Send SNI when the upstream is https. Without it the TLS handshake
        # carries no server name, and Container Apps' internal envoy closes
        # the connection rather than guessing -- which surfaces as
        #   peer closed connection in SSL handshake ... upstream: https://10.x:443
        # and a 502, with nothing at all in the API's log.
        #
        # proxy_ssl_name is stated explicitly even though $proxy_host is its
        # default: with a variable proxy_pass the upstream name is only known
        # per-request, and this is the one line that has to be right.
        proxy_ssl_server_name on;
        proxy_ssl_name        $proxy_host;

        # Keep the original host available to the app if it ever needs it.
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|woff2?|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
